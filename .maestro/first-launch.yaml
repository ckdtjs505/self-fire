# 처음 설치: 주제 고르기 → 불씨 점화(꾹 누르기) → 오늘의 모닥불 시트 → 홈 화면
appId: com.changsunoh.selfFire
name: 첫 실행과 오늘의 불씨 점화
---
- launchApp:
    clearState: true
- assertVisible: "어떤 불씨가 필요하세요?"
- tapOn: "건너뛰고 모든 명언 보기"

# 점화 화면: 불씨를 꾹 누른다 (1.5초 이상)
- assertVisible: "오늘의 불씨 켜기"
- longPressOn: "오늘의 불씨 켜기"
- extendedWaitUntil:
    notVisible: "오늘의 불씨 켜기"
    timeout: 5000

# 점화 완료 시트에 알림·위젯 제안이 뜨면 거절한다 (어느 쪽이 뜰지는 상태에 따라 다르다)
- runFlow:
    when:
      visible: "괜찮아요"
    commands:
      - tapOn: "괜찮아요"

# 홈 화면 헤더
- assertVisible: "메뉴 열기"
- assertVisible: "테마"
- assertVisible: "글꼴"
