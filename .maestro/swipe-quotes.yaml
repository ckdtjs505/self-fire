# 홈 화면: 오늘 따를 문장을 정한 뒤(완료 전) '다른 문장으로 바꾸기'로 명언을 넘겨 보고,
# 앞뒤로 넘겨 본 뒤 오늘 따르는 문장으로 돌아온다
# 완료한 날은 문장을 바꿀 수 없으므로, 앱을 새로 시작해 완료 전 상태를 만든다
appId: com.changsunoh.selfFire
name: 명언 넘기기
---
- launchApp:
    clearState: true
- tapOn: "건너뛰고 모든 명언 보기"
- tapOn: "오늘 이 문장대로 살기"
- assertVisible: "메뉴 열기"
- tapOn: "다른 문장으로 바꾸기"
- assertVisible: "오늘 따르는 문장으로 돌아가기"

# 왼쪽으로 두 번 넘겨 다음 명언으로
- swipe:
    direction: LEFT
    duration: 300
- swipe:
    direction: LEFT
    duration: 300

# 오른쪽으로 넘기면 이전 명언으로 돌아간다 (바꾸기 버튼은 그대로 보인다)
- swipe:
    direction: RIGHT
    duration: 300
- assertVisible: "오늘 따를 문장을 이 문장으로 바꾸기"

# 바꾸지 않고 돌아오면 오늘 따르는 문장 화면이다
- tapOn: "오늘 따르는 문장으로 돌아가기"
- assertVisible: "메뉴 열기"
- assertVisible: "다른 문장으로 바꾸기"
