# 홈 화면: 명언을 넘기고, 이전 명언으로 돌아갔다가 '새 명언으로'로 복귀
# first-launch 다음에 실행한다 (오늘의 불씨를 이미 켠 상태)
appId: com.changsunoh.selfFire
name: 명언 넘기기
---
- launchApp
- assertVisible: "메뉴 열기"

# 왼쪽으로 두 번 넘겨 다음 명언으로
- swipe:
    direction: LEFT
    duration: 300
- swipe:
    direction: LEFT
    duration: 300

# 오른쪽으로 넘기면 이전 명언 → '새 명언으로' 버튼이 뜬다
- swipe:
    direction: RIGHT
    duration: 300
- assertVisible: "새 명언으로"
- tapOn: "새 명언으로"
- assertNotVisible: "새 명언으로"
